<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Great Job Reporting!</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            max-width: 600px;
            text-align: center;
        }

        h1 {
            color: #2e7d32;
            margin-bottom: 10px;
        }

        p {
            color: #444;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .footer {
            margin-top: 25px;
            font-size: 0.85rem;
            color: #777;
        }

        .cta-box {
            margin-top: 30px;
            padding: 20px;
            background: #e8f5e9;
            border-radius: 10px;
        }

        .cta-link {
            font-size: 1.2rem;
            color: #2e7d32;
            font-weight: bold;
            text-decoration: none;
        }

        .cta-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✅</div>
        <h1>Great Job Reporting This Email!</h1>
        <p>
            You correctly identified this as a suspicious message.  
            Reporting phishing attempts helps keep everyone safe.
        </p>

        <div class="cta-box">
            <p><strong>Next Step:</strong></p>
            <p>Continue your training to stay sharp and secure.</p>
            <a class="cta-link" href="https://security-awareness-suite-itec490.netlify.app">
                Return to SafeWork Cyber Training Suite →
            </a>
        </div>

        <div class="footer">
            Security Awareness Training Exercise
        </div>
    </div>
</body>
</html>
